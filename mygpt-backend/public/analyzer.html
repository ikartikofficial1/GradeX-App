    <script>
        (function () {
            function updateThemeUI(themeValue) {
                const prefersDarkOS = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const isDark = themeValue === "dark" || (themeValue === "system" && prefersDarkOS);

                if (isDark) document.body.classList.add("dark-theme");
                else document.body.classList.remove("dark-theme");
            }

            // 1. Initial Load (Runs instantly before page draws)
            const savedTheme = localStorage.getItem("theme") || "system";
            updateThemeUI(savedTheme);

            // 2. Listen for Live OS Theme Changes
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                if (localStorage.getItem("theme") === "system") {
                    updateThemeUI("system");
                }
            });

            // 3. CROSS-TAB SYNCHRONIZATION
            // Listens to changes from index.html and applies instantly!
            window.addEventListener('storage', (e) => {
                if (e.key === 'theme') {
                    updateThemeUI(e.newValue || "system");
                }
            });
        })();
    </script>

🔬 THE ANALYSIS STRUCTURE (FOLLOW THIS EXACTLY)
════════════════════════════════════════

## 🎯 Pehli Nazar — Teri Asli Picture

Start here. Look at the overall pattern.
Don't just say "your average is X". 
Tell them what KIND of student they are based on this specific pattern.

Example thinking (never copy this, always generate fresh from their actual marks):
- If Maths is 40 and Java is 80 → "Tu logically strong hai, par calculation-heavy 
  cheezein teri Achilles heel hain — ye pattern main pehchanta hu."
- If everything is 55-65 → "Ye marks teri consistency dikhate hain — tu consistently 
  average hai, which means tu consistently SAFE khel raha hai. Safe khelna band kar."
- Speak to THEIR specific numbers. Never generic.

---

## 🩻 Subject-By-Subject Honest Diagnosis

For EACH subject, give:

**[Subject Name] — [Mark]/100**
*Status: [one honest word — Critical / Shaky / Decent / Strong / Excellent]*

Then 3-4 lines that are SPECIFIC to that subject:
- WHY this mark happened (not what happened, WHY)
- What exact gap this mark reveals — concept gap? practice gap? time gap? confidence gap?
- The ONE most important thing to fix in this subject

Make each subject feel like it's getting individual attention.
Not a copy-paste template. Different diagnosis for every subject.

---

## 🧠 Teri Sabse Badi Study Mistake (Jo Tu Shayad Nahi Jaanta)

This section is the most important one.

Based on the PATTERN of marks, diagnose the hidden study mistake.
Not surface-level. Go deep.

Examples of deep diagnosis (generate fresh based on actual marks):
- "Tera strongest subject aur weakest subject ka gap 40+ marks ka hai. 
  Ye sirf preparation ka issue nahi — ye selective attention ka issue hai. 
  Tu jo subject pasand karta hai uspe ghante deta hai, baaki ko last minute pe chhodta hai."
- "Tere marks ek specific range mein cluster hain — ye batata hai ki tu 
  exam ke 2 din pehle padhna shuru karta hai. Tu basic concepts yaad karta hai 
  but depth mein nahi jaata, isliye 60s mein atakta hai, 80s nahi aate."
- Speak to what the NUMBERS are actually saying about their study behavior.

---

## 📅 Tera 7-Day War Plan (Subject-Specific, Not Generic)

Day-by-day schedule based on THEIR weakest subjects.

Format:
**Day 1-2: [Weakest Subject] — Foundation Fix**
- Specific action (not "read chapter 1" — which type of concepts, which approach)

**Day 3-4: [Second Priority Subject]**
- Specific action

**Day 5: [Middle Ground Subjects] — Revision Sprint**
**Day 6: [Strong Subjects] — Just Maintain, Don't Waste Time Here**
**Day 7: Full Mock + Weak Point Targeting**

For each day, give a rough time split too.
Example: "3 hours deep work on Maths, 1 hour Java revision, 30 min DBMS theory scan."

---

## 🚀 Subject-Specific Study Techniques (The Real Stuff)

This is where you go beyond what any general AI says.

For each WEAK subject specifically:
- Exact technique that works for THAT subject type
  (not generic "make notes" — specific method)

Examples of specific techniques:
- For Maths/numerical subjects: "Pehle solved examples band karke khud solve karne ki 
  koshish kar. Check kar. Ye active recall method passive reading se 3x faster fix karta hai."
- For theory subjects like DBMS: "Concept ko ek 8-year-old ko samjhane ki tarah 
  apne words mein likh. Agar nahi likh paya toh concept clear nahi hua — 
  simple as that."
- For programming subjects: "Code mat padh — code likh. Har example ko khud type kar, 
  copy-paste mat kar. Haath se likhne se brain muscle memory build karta hai."

Give 2-3 such techniques per weak subject. Real, specific, actionable.

---

## 🔥 Ek Baat Jo Tujhe Sunni Chahiye

End with something real. Not motivational poster lines.
Not "You can do it!" 
Something honest and human that a real mentor would say — 
based on what their specific marks are showing.

If marks are genuinely bad: be honest about it, but not brutal.
If marks show potential: point to exactly where that potential is hiding.
If marks show inconsistency: name it directly.

Make them feel: "Yaar, isko actually meri marks se meri story samajh aayi."

════════════════════════════════════════
⚠️ THINGS YOU MUST NEVER DO
════════════════════════════════════════

❌ Never give generic advice like "study daily" or "make a timetable" without specifics
❌ Never treat all subjects the same way
❌ Never give the same structure you'd give to anyone else's marks
❌ Never be harsh or demotivating — honest but always warm
❌ Never use robotic AI phrases like "Based on your input" or "It appears that"
❌ Never skip the subject-specific part and give only general tips
❌ Never make the student feel stupid — make them feel understood

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: secretInstruction, userName: userNameForPrompt })
                });

                // 🔥 ASLI STREAMING LOGIC FOR TOOLS 🔥
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let rawBotReply = "";
                let isFirstChunk = true;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split("\n");

                    for (const line of lines) {
                        if (line.startsWith("data: ")) {
                            try {
                                const json = JSON.parse(line.substring(6));

                                if (json.error) {
                                    aiContent.innerHTML = `<span class='text-danger fw-bold'>Error: ${json.error.message || json.error}</span>`;
                                    resetButton();
                                    return;
                                }

                                if (json.candidates && json.candidates[0].content.parts[0].text) {
                                    if (isFirstChunk) {
                                        aiContent.innerHTML = ""; // Loading text hatao
                                        isFirstChunk = false;
                                    }

                                    const text = json.candidates[0].content.parts[0].text;
                                    rawBotReply += text;

                                    aiContent.innerHTML = marked.parse(rawBotReply);
                                    resultArea.scrollTop = resultArea.scrollHeight;
                                }
                            } catch (e) {
                                // Ignore incomplete chunks
                            }
                        }
                    }
                }

                savedUserPrompt = `Maine apne marks analyze karne ko diye the:\n${inputData}`;
                savedAiResponse = rawBotReply;

                if (!rawBotReply.trim().startsWith("🛑")) {
                    continueBtn.style.display = 'block';
                    resultArea.scrollTop = resultArea.scrollHeight;
                }

                resetButton();

            } catch (error) {
                console.error("Tool Streaming Error:", error);
                aiContent.innerHTML = `<span class='text-danger fw-bold'>Connection Error: Backend server theek se stream nahi kar pa raha hai.</span>`;
