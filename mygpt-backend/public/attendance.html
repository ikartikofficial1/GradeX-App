            color: var(--text-main);

            text-decoration: none;

            display: inline-flex;

        }

        .main-container {

            display: flex;
            justify-content: center;

        .calculator-card {

        .custom-input {

        .custom-input:focus {
            border-color: var(--light-brown);
            outline: none;
            box-shadow: 0 0 0 4px rgba(192, 133, 82, 0.1);
        }

        .calc-btn {
            background-color: var(--med-brown);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-weight: 600;
            margin-top: 10px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(140, 90, 60, 0.2);
        }

        .calc-btn:hover {
            background-color: var(--dark-brown);
            transform: translateY(-2px);

        .explain-btn {

            border: 2px solid var(--light-brown);

        .continue-btn {
            background-color: transparent;
            border: 2px solid var(--med-brown);

            width: 100%;

            border-radius: 12px;
            font-weight: 600;
            margin-top: 15px;
            display: none;

            background-color: var(--med-brown);

        .loader-container {

        /* 🍞 TOAST NOTIFICATION 🍞 */
        .custom-toast {

            padding: 12px 24px;

        .custom-toast.error {

            background-color: #F0FDF4;
            color: #27AE60;

        body.dark-theme .custom-toast.error {

            background-color: #1A2C20;
            color: #2ECC71;
            border-color: rgba(46, 204, 113, 0.2);

    <script>
        (function () {
            function updateThemeUI(themeValue) {
                const prefersDarkOS = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const isDark = themeValue === "dark" || (themeValue === "system" && prefersDarkOS);
                if (isDark) document.body.classList.add("dark-theme");
                else document.body.classList.remove("dark-theme");
            }

            const savedTheme = localStorage.getItem("theme") || "system";
            updateThemeUI(savedTheme);

            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                if (localStorage.getItem("theme") === "system") updateThemeUI("system");
            });

            window.addEventListener('storage', (e) => {
                if (e.key === 'theme') updateThemeUI(e.newValue || "system");
            });
        })();
    </script>

    <div class="main-container">

            <div class="input-group-custom">

    <script>
        // ─────────────────────────────────────────────
        // FIREBASE INIT
        // ─────────────────────────────────────────────
        const firebaseConfig = {
            apiKey: "AIzaSyAYZi5fvboG6OCr8QtD8y2S29sRPDK4cd4",
            authDomain: "my-gemini-bot-gradex.firebaseapp.com",
            databaseURL: "https://my-gemini-bot-gradex-default-rtdb.firebaseio.com/",
            projectId: "my-gemini-bot-gradex",
            storageBucket: "my-gemini-bot-gradex.firebasestorage.app",
            messagingSenderId: "979133444805",
            appId: "1:979133444805:web:e1bc587482362365e2b6ac"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth();
        const database = firebase.database();
        let currentUser = null;
        auth.onAuthStateChanged(user => { currentUser = user; });

        // ─────────────────────────────────────────────
        // STATE
        // ─────────────────────────────────────────────
        let mathAnalysis = "";
        let rawBotReply = "";

        // 🍞 TOAST FUNCTION
        window.showToast = function (message, type = 'error') {
            const toast = document.getElementById('custom-toast');
            if (!toast) return;
            const msgEl = document.getElementById('toast-message');

            toast.className = 'custom-toast';
            toast.classList.add(type);
            msgEl.innerText = message;

            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        };

        // ─────────────────────────────────────────────
        // CORE ATTENDANCE LOGIC
        // ─────────────────────────────────────────────
        function calcMaxBunks(attended, total, targetPct) {
            const t = targetPct / 100;
            const bunks = Math.floor((attended - t * total) / t);
            return Math.max(0, bunks);
        }

        function calcClassesNeeded(attended, total, targetPct) {
            const t = targetPct / 100;
            if (t >= 1) return Infinity;
            const needed = Math.ceil((t * total - attended) / (1 - t));
            return Math.max(0, needed);
        }

        function projectedPercent(attended, total, extraAttended) {
            const newAttended = attended + extraAttended;
            const newTotal = total + extraAttended;
            return (newAttended / newTotal) * 100;
        }

        function percentAfterBunks(attended, total, bunks) {
            const newTotal = total + bunks;
            return newTotal === 0 ? 0 : (attended / newTotal) * 100;
        }

        // ─────────────────────────────────────────────
        // INPUT VALIDATION
        // ─────────────────────────────────────────────
        function validateInputs(total, attended, target) {
            if (isNaN(total) || isNaN(attended) || isNaN(target)) {
                return "Saari fields bharo bhai! Koi field khali nahi rehni chahiye.";
            }
            if (!Number.isInteger(total) || !Number.isInteger(attended)) {
                return "Classes sirf whole numbers mein hoti hain — decimal mat daalo!";
            }
            if (total <= 0) {
                return "Total classes kam se kam 1 honi chahiye!";
            }
            if (attended < 0) {
                return "Attended classes negative nahi ho sakti!";
            }
            if (attended > total) {
                return "Attended classes, total classes se zyada nahi ho sakti bhai!";
            }
            if (target <= 0 || target >= 100) {
                return "Target percentage 1% aur 99% ke beech honi chahiye!";
            }
            return null;
        }

        // ─────────────────────────────────────────────
        // MAIN CALCULATE FUNCTION
        // ─────────────────────────────────────────────
        function calculateAttendance() {
            const totalRaw = document.getElementById('total-classes').value.trim();
            const attendedRaw = document.getElementById('attended-classes').value.trim();
            const targetRaw = document.getElementById('target-percent').value.trim();

            const total = Number(totalRaw);
            const attended = Number(attendedRaw);
            const target = Number(targetRaw);

            // Validate
            const error = validateInputs(total, attended, target);
            if (error) {
                showToast(error, 'error'); // 🔥 Alert hata diya!
                return;
            }

            const currentPercent = (attended / total) * 100;
            const isSafe = currentPercent >= target;
            const isEdge = isSafe && (currentPercent - target) < 2;

            // ── UI Reset ──
            document.getElementById('result-area').style.display = 'block';
            document.getElementById('ai-analysis').style.display = 'none';
            document.getElementById('continue-btn').style.display = 'none';
            document.getElementById('ai-text').innerHTML = '';

            const explainBtn = document.getElementById('explain-btn');
            explainBtn.style.display = 'block';
            explainBtn.disabled = false;
            explainBtn.innerText = "🤔 Explain me how? Kya karu?";

            // ── Percent Circle ──
            document.getElementById('res-percent').innerText = currentPercent.toFixed(1) + "%";
            const circle = document.getElementById('res-circle');

            // ── Action Text & Color ──
            let actionText = "";
            let statsHTML = "";

            if (isSafe) {
                const maxBunks = calcMaxBunks(attended, total, target);

                if (isEdge || maxBunks === 0) {
                    actionText = `⚠️ Bilkul boundary pe khada hai! Ek bhi bunk aur tu danger zone mein!`;
                    circle.style.borderColor = "var(--warning-yellow)";

                    const pctAfter1Bunk = percentAfterBunks(attended, total, 1).toFixed(1);
                    statsHTML = `
                        <div class="stat-item">
                            <div class="stat-label">Current %</div>
                            <div class="stat-value warning">${currentPercent.toFixed(1)}%</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Safe Bunks Left</div>
                            <div class="stat-value warning">${maxBunks} class${maxBunks === 1 ? '' : 'es'}</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">% After 1 Bunk</div>
                            <div class="stat-value danger">${pctAfter1Bunk}%</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Target</div>
                            <div class="stat-value">${target}%</div>
                        </div>
                    `;
                } else {
                    actionText = `✅ Safe Zone! Tu ${maxBunks} aur classes bunk kar sakta hai.`;
                    circle.style.borderColor = "var(--safe-green)";

                    const halfBunks = Math.floor(maxBunks / 2);
                    const pctAfterHalf = percentAfterBunks(attended, total, halfBunks).toFixed(1);
                    const pctAfterAll = percentAfterBunks(attended, total, maxBunks).toFixed(1);
                    statsHTML = `
                        <div class="stat-item">
                            <div class="stat-label">Current %</div>
                            <div class="stat-value safe">${currentPercent.toFixed(1)}%</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Max Bunks Available</div>
                            <div class="stat-value safe">${maxBunks} classes</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">% After ${halfBunks} Bunks</div>
                            <div class="stat-value">${pctAfterHalf}%</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">% If All Bunks Used</div>
                            <div class="stat-value warning">${pctAfterAll}%</div>
                        </div>
                    `;
                }
            } else {
                const needed = calcClassesNeeded(attended, total, target);
                actionText = `🚨 Danger! Tujhe lagatar ${needed} classes attend karni padengi bina ek bhi miss kiye.`;
                circle.style.borderColor = "var(--danger-red)";

                const pctAfter10 = projectedPercent(attended, total, Math.min(10, needed)).toFixed(1);
                const gap = (target - currentPercent).toFixed(1);
                statsHTML = `
                    <div class="stat-item">
                        <div class="stat-label">Current %</div>
                        <div class="stat-value danger">${currentPercent.toFixed(1)}%</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Gap to Target</div>
                        <div class="stat-value danger">-${gap}%</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Classes Needed</div>
                        <div class="stat-value danger">${needed} consecutive</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">% After ${Math.min(10, needed)} Classes</div>
                        <div class="stat-value warning">${pctAfter10}%</div>
                    </div>
                `;
            }

            document.getElementById('res-action').innerText = actionText;
            document.getElementById('stats-grid').innerHTML = statsHTML;

            // ── Build mathAnalysis for AI prompt ──
            const maxBunks = isSafe ? calcMaxBunks(attended, total, target) : 0;
            const needed = !isSafe ? calcClassesNeeded(attended, total, target) : 0;
            mathAnalysis = `
Student Attendance Data:
- Total classes held: ${total}
- Classes attended: ${attended}
- Current percentage: ${currentPercent.toFixed(2)}%
- Target percentage: ${target}%
- Status: ${isSafe ? (isEdge || maxBunks === 0 ? "AT EDGE (0 buffer)" : `SAFE ZONE`) : "DANGER ZONE"}
${isSafe
                    ? `- Maximum additional classes student can bunk (while staying ≥${target}%): ${maxBunks}
- Percentage after using all ${maxBunks} bunks: ${percentAfterBunks(attended, total, maxBunks).toFixed(2)}%`
                    : `- Consecutive classes student must attend without missing any to reach ${target}%: ${needed}
- Projected % after attending ${needed} consecutive classes: ${projectedPercent(attended, total, needed).toFixed(2)}%`
                }
- Summary: ${actionText}
            `.trim();
        }

        // ─────────────────────────────────────────────
        // AI EXPLAIN
        // ─────────────────────────────────────────────
        async function explainWithAI() {
            const aiArea = document.getElementById('ai-analysis');
            const aiText = document.getElementById('ai-text');
            const aiLoading = document.getElementById('ai-loading');
            const continueBtn = document.getElementById('continue-btn');
            const explainBtn = document.getElementById('explain-btn');

            aiArea.style.display = 'block';
            aiLoading.style.display = 'flex';
            aiText.innerHTML = `<span style="color: var(--light-brown); font-weight: 500; font-style: italic;">Wait, check kar raha hu...</span>`;
            explainBtn.disabled = true;
            explainBtn.innerText = "Processing... ⏳";
            rawBotReply = "";

            const userName = currentUser ? currentUser.displayName.split(" ")[0] : "Dost";

            const prompt = `
You are not an AI tool. You are not an attendance calculator.

You are ${currentUser ? currentUser.displayName.split(" ")[0] : "Dost"}'s most trusted college senior — 
someone who has personally navigated the brutal attendance game, 
knows every rule, every loophole, every mistake students make, 
and genuinely wants this person to come out on top.

THE EXACT NUMBERS:
${mathAnalysis}

🧠 BEFORE YOU WRITE — THE INTERNAL SCAN
════════════════════════════════════════

Read the numbers silently. Then feel the real situation:

→ How serious is this actually?
   Calculate the precise gap between current % and target %.
   Is this a minor course correction or a genuine crisis?

→ What does this attendance % tell you about this student's college life?
   Someone at 45% isn't lazy — they're probably overwhelmed, stressed, or dealing with something real.
   Someone at 73% when target is 75% is one bad week away from trouble.
   Someone at 85% is safe but needs to know exactly how much buffer they have.

→ What is the PRECISE math behind their situation?
   Do the actual calculations:
   - If they're SAFE: exactly how many classes can they miss before hitting danger?
   - If they're in DANGER: exactly how many consecutive classes must they attend?
   - If they're at the EDGE: what's the next 2 weeks going to look like?

→ What are the REAL RISKS they might not be thinking about?
   Sick days? Festivals? College events? Last-minute leaves?
   Factor real life into this — not just raw numbers.

Only after this full scan — begin writing.

**The Smart Bunk Strategy (If Safe):**
"Bunk karna hai toh smarter way se:
- Back-to-back classes ke beech wali bunk zyada efficient hai
- Friday last period aur Monday first period — safest bunks
- Teacher jo attendance strictly lete hain unki class kabhi mat chodo"

**The Medical Leave Hack:**
"Agar genuinely sick ho — medical certificate le lo.
Kai colleges mein medical leave attendance mein count hoti hai.
Apne college ka rule check karo — ye ek legitimate option hai."

**The Early Warning System:**
"Apne phone mein reminder set karo:

Agar kisi bhi subject mein [target - 5%] se neeche aayi —

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: prompt,
                        userName: userName
                    })
                });

                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }

                // SSE Streaming
                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let isFirstChunk = true;
                let buffer = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split("\n");

                    // Keep last incomplete line in buffer
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (!line.startsWith("data: ")) continue;
                        const payload = line.substring(6).trim();
                        if (!payload || payload === "[DONE]") continue;

                        try {
                            const json = JSON.parse(payload);

                            // Handle error from API
                            if (json.error) {
                                aiLoading.style.display = 'none';
                                aiText.innerHTML = `<span class='text-danger fw-bold'>Error: ${json.error.message || json.error}</span>`;
                                explainBtn.innerText = "🤔 Explain me how? Kya karu?";
                                explainBtn.disabled = false;
                                return;
                            }

                            // Gemini response structure
                            const textChunk = json?.candidates?.[0]?.content?.parts?.[0]?.text;
                            if (textChunk) {
                                if (isFirstChunk) {
                                    aiLoading.style.display = 'none';
                                    aiText.innerHTML = "";
                                    isFirstChunk = false;
                                }
                                rawBotReply += textChunk;
                                aiText.innerHTML = marked.parse(rawBotReply);
                            }
                        } catch (parseErr) {
                            // Partial JSON line — skip silently
                        }
                    }
                }

                // Handle anything left in buffer after stream ends
                if (buffer.startsWith("data: ")) {
                    try {
                        const json = JSON.parse(buffer.substring(6).trim());
                        const textChunk = json?.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (textChunk) {
                            rawBotReply += textChunk;
                            aiText.innerHTML = marked.parse(rawBotReply);
                        }
                    } catch (_) { /* ignore */ }
                }

                // If stream ended but nothing was written (empty response)
                if (isFirstChunk) {
                    aiLoading.style.display = 'none';
                    aiText.innerHTML = `<span class='text-danger fw-bold'>AI ne koi response nahi diya. Dobara try karo!</span>`;
                    explainBtn.innerText = "🤔 Try Again";
                    explainBtn.disabled = false;
                    return;
                }

                explainBtn.style.display = "none";
                continueBtn.style.display = 'block';

            } catch (err) {
                console.error("Streaming Error:", err);
                aiLoading.style.display = 'none';
                aiText.innerHTML = `<span class='text-danger fw-bold'>Backend se connect nahi ho paya yaar! Network check kar lo.</span>`;
                explainBtn.innerText = "🤔 Try Again";
                explainBtn.disabled = false;
            }
        }
