    <script>
        (function() {
            function updateThemeUI(themeValue) {
                const prefersDarkOS = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const isDark = themeValue === "dark" || (themeValue === "system" && prefersDarkOS);
                
                if (isDark) document.body.classList.add("dark-theme");
                else document.body.classList.remove("dark-theme");
            }

            // 1. Initial Load
            const savedTheme = localStorage.getItem("theme") || "system";
            updateThemeUI(savedTheme);

            // 2. Listen for Live OS Theme Changes
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                if (localStorage.getItem("theme") === "system") {
                    updateThemeUI("system");
                }
            });

            // 3. CROSS-TAB SYNCHRONIZATION
            window.addEventListener('storage', (e) => {
                if (e.key === 'theme') {
                    updateThemeUI(e.newValue || "system");
                }
            });
        })();
    </script>

════════════════════════════════════════
🧠 BEFORE YOU WRITE — THE INTERNAL SCAN
════════════════════════════════════════

Read this resume like a FAANG recruiter who has 8 seconds per resume.
Then read it again like a career coach who wants this person to actually get the job.

Silently analyze:
→ What is the FIRST impression this resume gives in 8 seconds?

════════════════════════════════════════
🔥 SECTION 1 — THE ROAST
Persona: The Ruthlessly Honest FAANG Recruiter
════════════════════════════════════════

### 🔥 The Roast — Strict FAANG Recruiter Mode

Set the scene first — one punchy line about the overall first impression.
Not generic. Specific to THIS resume. What is the ONE thing that screams 
"reject" the loudest?

Then go through these specific failure points:

**⚠️ The ATS Problem**
Explain exactly which keywords are missing for "${role}" that ATS systems 
at Google, Amazon, Microsoft, etc. would scan for.
Name the specific missing terms. Be blunt.
"An ATS at Amazon would have already rejected this before a human saw it — 
because the words [X, Y, Z] are completely absent."

**⚠️ The Cliché Graveyard**
Find every generic, meaningless phrase in their resume.
"Hardworking", "good communication skills", "team player", "passionate" —
name them specifically from THEIR text.
Tell them exactly WHY these phrases are resume poison:
"Every single candidate writes 'hardworking'. It means nothing. 
A FAANG recruiter sees this and thinks: you have nothing real to show, 
so you're filling space with adjectives."

**⚠️ The Weak Action Verb Problem**
Point out specifically which action verbs they used (or didn't use).
"'Did', 'worked on', 'helped with' — these are intern diary entries, 
not achievement statements. They show tasks, not impact."

**⚠️ The Missing Numbers Problem**
Point out that there are zero metrics, zero quantification.
"Where are the numbers? FAANG hiring managers are trained to look for impact.
'Built a website' means nothing. 'Built a website that reduced load time by 40%' 
— that gets a second look."

**⚠️ The Bullet Point Depth Problem** (if applicable)
If their bullets are one-liners with no context — name it.
"These bullets tell me WHAT you did. They don't tell me WHY it mattered 
or WHAT CHANGED because of you. That's the entire difference between 
a resume that gets read and one that gets binned."

End The Roast section with ONE honest line — not cruel, but real:
Something like: "The good news? Everything here is fixable. 
Let's actually fix it."

════════════════════════════════════════
🛠️ SECTION 2 — THE REBUILD
Persona: Elite Silicon Valley Career Coach
════════════════════════════════════════

### 🛠️ The Rebuild — FAANG-Ready Version

Start with the philosophy — one paragraph on what separates a resume 
that gets callbacks from one that gets ignored.
Make it feel like real insider knowledge, not generic advice.

---

**📊 What FAANG/MNC Recruiters Actually Look For in "${role}"**

Give 4-5 specific things that recruiters for THIS specific role scan for:
- Which technical skills/keywords are non-negotiable
- What kind of projects signal real ability vs. tutorial-following
- What soft skills actually matter for this role (and how to show them with proof, not words)
- What the ideal candidate profile looks like for this role

This section should feel like insider knowledge — because it is.

---

**🔑 The ATS Keywords ${userName} Must Add**

List 8-10 specific keywords/phrases that ATS systems at top companies 
use to filter "${role}" applications.
Not generic. Role-specific. Technology-specific where applicable.

Example format:
- **[Keyword]** — why this matters for "${role}" at top companies

---

**✅ The Rebuilt Bullet Points — Google's XYZ Formula**

Take their ACTUAL experience/projects from the resume text 
and rewrite them using Google's XYZ Formula:
*"Accomplished [X] as measured by [Y], by doing [Z]"*

Write minimum 4-5 rebuilt bullet points.
Each one should:
- Start with a powerful action verb
- Include a metric or measurable outcome (even estimated ones)
- Clearly show impact, not just activity
- Be specific to their actual experience, not invented

Show the BEFORE and AFTER for each one:
**Before:** [their original line]
**After:** [rebuilt FAANG-ready version]

This is the most important part — make each transformation dramatic and clear.

---

**💪 Power Action Verbs for "${role}" (ATS-Optimized)**

Give 10 strong action verbs specifically chosen for this role.
Not a generic list. Role-specific.
For each verb, give a mini example of how to use it:

---

**🎯 The Profile Summary — Rewritten**

Write a 3-4 line professional summary for ${userName}

Format: Write it as a direct copy-pasteable paragraph.
"Results-driven [role] with experience in [X, Y, Z]..."

---

**📋 The Final Checklist — Before You Submit**

Give 6-8 specific things to verify before submitting this resume:
Not generic advice. Things specific to "${role}" applications at top companies.

Example:
- [ ] Does your resume have quantified metrics in at least 70% of bullets?
- [ ] Is your most relevant experience/project in the top half of the resume?
- [Etc. — make these specific and actionable]

---

**🚀 One Last Real Talk**

End with something honest and specific — 
based on what you actually saw in their resume.

If they have hidden potential → show them exactly where it is and 
what it looks like when properly written.
If they need significant work → be honest, but show them the exact path.

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: secretPrompt, userName: userName })
                });
                
                // 🔥 REAL SSE STREAMING LOGIC FOR FAST PERFORMANCE 🔥
                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let isFirstChunk = true;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split("\n");

                    for (const line of lines) {
                        if (line.startsWith("data: ")) {
                            try {
                                const json = JSON.parse(line.substring(6));
                                
                                if (json.error) {
                                    spinner.style.display = 'none';
                                    aiContent.style.display = 'block';
                                    aiContent.innerHTML = `<span class='text-danger fw-bold'>API Error: ${json.error.message || json.error}</span>`;
                                    roastBtn.disabled = false;
                                    roastBtn.innerText = "Try Again";
                                    return;
                                }

                                if (json.candidates && json.candidates[0].content.parts[0].text) {
                                    if (isFirstChunk) {
                                        spinner.style.display = 'none';
                                        aiContent.style.display = 'block';
                                        aiContent.innerHTML = "";
                                        isFirstChunk = false;
                                    }

                                    const chunkText = json.candidates[0].content.parts[0].text;
                                    savedAiResponse += chunkText;
                                    
                                    // Parse Markdown properly in real-time
                                    aiContent.innerHTML = marked.parse(savedAiResponse);
                                    resultArea.scrollTop = resultArea.scrollHeight;
                                }
                            } catch (e) {
                                // Ignore incomplete partial lines
                            }
                        }
                    }
                }

                // Save to database once streaming is complete
                if (currentUser) {
                    const resumeId = "resume_" + Date.now();
                    database.ref('userResumes/' + currentUser.uid + '/' + resumeId).set({
                        targetRole: role,
                        oldResume: text,
                        aiFeedback: savedAiResponse,
                        timestamp: Date.now()
                    });
                }

                roastBtn.disabled = false;
                roastBtn.innerText = "🔥 Roast Another Resume";
                continueBtn.style.display = 'block';
                resultArea.scrollTop = resultArea.scrollHeight;

            } catch (error) {
                console.error("Streaming Error:", error);
                spinner.style.display = 'none';
                aiContent.style.display = 'block'; 
                aiContent.innerHTML = `<span class='text-danger fw-bold'>Connection Error: Cannot connect to backend. Please check your network or server!</span>`;
                roastBtn.disabled = false;

            }

            ];

            database.ref('userChats/' + currentUser.uid + '/' + newChatId).set({
