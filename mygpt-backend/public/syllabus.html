        (function () {
            function updateThemeUI(themeValue) {
                const prefersDarkOS = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const isDark = themeValue === "dark" || (themeValue === "system" && prefersDarkOS);

                if (isDark) document.body.classList.add("dark-theme");
                else document.body.classList.remove("dark-theme");
            }

            // 1. Initial Load
            const savedTheme = localStorage.getItem("theme") || "system";
            updateThemeUI(savedTheme);

            // 2. Listen for Live OS Theme Changes
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                if (localStorage.getItem("theme") === "system") {
                    updateThemeUI("system");
                }
            });

            // 3. CROSS-TAB SYNCHRONIZATION
            window.addEventListener('storage', (e) => {
                if (e.key === 'theme') {
                    updateThemeUI(e.newValue || "system");
                }
            });
        })();
    </script>

                            } catch (e) {
                                // Ignore incomplete chunks during streaming
                            }
                        }
                    }
                }

                savedUserPrompt = `I have ${days} days left and this is my syllabus:\n${topics}`;

                // Show continue button if it wasn't an off-topic error response
                if (!savedAiResponse.trim().startsWith("🛑")) {
                    continueBtn.style.display = 'block';
                    resultArea.scrollTop = resultArea.scrollHeight;
                }

                resetButton();

            } catch (error) {
                console.error("Streaming Error:", error);
                loadingSpinner.style.display = 'none';
                aiContent.style.display = 'block';
                aiContent.innerHTML = `<span class='text-danger fw-bold'>Connection Error: Cannot connect to the backend server. Please verify your connection or check the server!</span>`;
                resetButton();
            }
        }

        function resetButton() {
            const analyzeBtn = document.getElementById('analyze-btn');
            analyzeBtn.disabled = false;
            analyzeBtn.innerText = "🚀 Build Master Study Plan";
        }

        function continueInMainChat() {
            if (!currentUser) {
                alert("Please log in on the main chat page first to save this conversation!");
                window.location.href = 'index.html';
                return;
            }

            const continueBtn = document.getElementById('continue-btn');
            continueBtn.innerText = "Preparing Chat... ⏳";
            continueBtn.disabled = true;

            const newChatId = "syllabus_" + Date.now();

            const initialMessages = [
                { role: 'user', text: savedUserPrompt },
                { role: 'bot', text: savedAiResponse },
                { role: 'bot', text: "Yes my friend, what specific issues are you facing with this schedule? Do you need a detailed breakdown of any specific topic? I'm here to help! 😊" }
            ];

            database.ref('userChats/' + currentUser.uid + '/' + newChatId).set({
                title: "⏳ Time vs Syllabus Plan",
                messages: initialMessages
            }).then(() => {
                localStorage.setItem('activeChatId', newChatId);
                window.location.href = 'index.html';
            });
        }
    </script>
</body>

</html>
