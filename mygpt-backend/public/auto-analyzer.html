        (function () {
            function updateThemeUI(themeValue) {
                const prefersDarkOS = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const isDark = themeValue === "dark" || (themeValue === "system" && prefersDarkOS);

                if (isDark) document.body.classList.add("dark-theme");
                else document.body.classList.remove("dark-theme");
            }

            // 1. Initial Load (Runs instantly before page draws)
            const savedTheme = localStorage.getItem("theme") || "system";
            updateThemeUI(savedTheme);

            // 2. Listen for Live OS Theme Changes
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                if (localStorage.getItem("theme") === "system") {
                    updateThemeUI("system");
                }
            });

            // 3. CROSS-TAB SYNCHRONIZATION
            // Listens to changes from index.html and applies instantly!
            window.addEventListener('storage', (e) => {
                if (e.key === 'theme') {
                    updateThemeUI(e.newValue || "system");
                }
            });
        })();
    </script>

## 📅 Tera Weekly War Routine

NOT a generic timetable. Built specifically for THEIR marks.

**Daily Time Split Logic:**
First explain the philosophy — weakest subjects get PRIME time (fresh brain, morning),
strongest subjects get maintenance time (evening, less energy needed).

Then give day-by-day:

**Monday + Tuesday — [Weakest Subject] Deep Work**

- Which topics, how long

**Saturday — [Strong Subjects] Maintenance + Mock Practice**

**Sunday — Full Weak Point Test**
- Specifically test the areas identified in Section 2

Give rough hour splits per day too.
Example: "3 hrs Maths deep work, 1.5 hrs DBMS theory, 45 min Java revision."

════════════════════════════════════════
🎯 SECTION 5 — MONTHLY TARGETS (REALISTIC)
════════════════════════════════════════

For each subject, give a specific target:

**[Subject]: Currently [X] → Target by Month End: [Y]**

[2-3 specific actions, not generic]

Make targets ambitious but honest.
If a subject is at 40, don't say "target 90 this month" — that's fake motivation.
Say "target 60, here's exactly how."

That honesty builds more trust than fake optimism.

2-3 techniques per weak subject. Real, specific, immediately usable.

End with something real. Not poster motivation.

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: secretInstruction, userName: userNameForPrompt })
                });

                // 🔥 REAL SSE STREAMING LOGIC FOR FAST PERFORMANCE 🔥
                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let isFirstChunk = true;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split("\n");

                    for (const line of lines) {
                        if (line.startsWith("data: ")) {
                            try {
                                const json = JSON.parse(line.substring(6));

                                if (json.error) {
                                    spinner.style.display = 'none';
                                    aiContent.style.display = 'block';
                                    aiContent.innerHTML = `<span class='text-danger fw-bold'>Error: ${json.error.message || json.error}</span>`;
                                    genBtn.disabled = false;
                                    genBtn.innerText = "Try Again";
                                    return;
                                }

                                if (json.candidates && json.candidates[0].content.parts[0].text) {
                                    if (isFirstChunk) {
                                        spinner.style.display = 'none';
                                        aiContent.style.display = 'block';
                                        aiContent.innerHTML = "";
                                        isFirstChunk = false;
                                    }

                                    const text = json.candidates[0].content.parts[0].text;
                                    rawBotReply += text;

                                    // Parse Markdown properly
                                    aiContent.innerHTML = marked.parse(rawBotReply);
                                }
                            } catch (e) {
                                // Ignore incomplete partial lines
                            }
                        }
                    }
                }

                genBtn.disabled = false;
                genBtn.innerText = "✨ Regenerate Action Plan";
                continueBtn.style.display = 'block';

            } catch (error) {
                console.error("Streaming Error:", error);
                spinner.style.display = 'none';
                aiContent.style.display = 'block';
                aiContent.innerHTML = `<span class='text-danger'>Network or connection error. Please check your connection!</span>`;
                genBtn.disabled = false;
                genBtn.innerText = "Try Again";
            }
